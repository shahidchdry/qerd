[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qerd"
version = "0.1.0"
description = "Quantum Equilibrium-Response Diffusion (QERD): O(1)-Circuit Contrastive Optimization for Ising Generative Models on Noisy NISQ Hardware"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
experiments = [
    "torch>=2.0",
    "torchvision>=0.15",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]
qpu = ["pennylane>=0.35"]
qiskit = ["qiskit>=1.2", "qiskit-ibm-runtime>=0.30"]
all = [
    "torch>=2.0",
    "torchvision>=0.15",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pennylane>=0.35",
    "qiskit>=1.2",
    "qiskit-ibm-runtime>=0.30",
]

[tool.setuptools.packages.find]
include = ["qerd*"]
